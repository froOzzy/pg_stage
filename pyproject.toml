[tool.poetry]
name = "pg_stage"
version = "0.4.2"
description = "Anonymization of data in pg_dump"
authors = ["froOzzy"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["BLE", "FBT", "B", "A", "COM", "C4", "EM", "FIX", "I", "D101", "D102", "D103"]
fixable = ["I"]
ignore = ["COM812"]

[tool.ruff.lint.per-file-ignores]
"src/**" = ["D101", "D102", "D103"]

[tool.ruff.format]
quote-style = "single"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pg_stage"
version = "0.4.2"
authors = [
  { name="froOzzy", email="development@osintforce.ru" },
]
description = "Anonymization of data in pg_dump"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["mimesis == 4.1.3", "typing-extensions >= 4.5.0"]
license = "MIT"
license-files = ["LICENSE.txt"]

[project.urls]
"Homepage" = "https://github.com/froOzzy/pg_stage"

[tool.poetry.dependencies]
python = ">=3.7"
mimesis = "4.1.3"
typing-extensions = ">=4.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "7.3.1"
bandit = "1.7.5"
pbr = "7.1.3"
ruff = "0.16.8"
mypy = "1.4.1"

[tool.bandit]
# Инструменты tests/tools проверяются; pytest-проверки и их helpers исключены.
exclude_dirs = [
    ".venv",
    "tests/custom",
    "tests/plain",
    "tests/load",
    "tests/conftest.py",
    "tests/helpers.py",
    "*/test_*.py",
]
